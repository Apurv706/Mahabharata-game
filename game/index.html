<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurukshetra Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a manuscript leaf (scene) beside a ledger (obligations); the ledger drops below the leaf on phones. */
:root {
  --night: #16131f;
  --leaf: #221d2e;
  --leaf-2: #2d2640;
  --ink: #f1e6cc;
  --ink-dim: #b9ae96;
  --gold: #d4a84b;
  --saffron: #e5872e;
  --vermilion: #d0553b;
  --malachite: #4fa083;
  --track: #3a3350;
  --rule: rgba(212,168,75,.22);
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .01em; }
.brand small { font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-left: 10px; }
.where { font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.where b { color: var(--gold); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; margin-right: 8px; }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: minmax(0,1fr); } }

.leaf { background: var(--leaf); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; min-width: 0; }
.plate { height: 150px; position: relative; background: var(--plate, linear-gradient(120deg, #3b5ba9, #e5872e)); }
.plate::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(241,230,204,.35); border-radius: 6px; pointer-events: none; }
.plate span { position: absolute; left: 22px; bottom: 16px; font-family: var(--display); font-style: italic; font-size: 16px; color: rgba(241,230,204,.85); }
.tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.tag.canon { color: var(--night); background: var(--gold); }
.tag.yours { color: var(--saffron); border: 1px solid var(--saffron); }
.plate .tag { position: absolute; top: 20px; right: 20px; }
.plate.painted { height: clamp(220px, 34vw, 340px); background: var(--img) center 40% / cover no-repeat, var(--leaf-2); }
.plate.painted::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(22,19,31,.92), rgba(22,19,31,.15) 55%, rgba(22,19,31,0)); }
.plate.painted span { z-index: 1; display: grid; gap: 2px; font-style: normal; bottom: 20px; right: 22px; }
.plate.painted span b { font-family: var(--display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; color: var(--ink); line-height: 1.05; }
.plate.painted span small { font-family: var(--body); font-size: 15px; color: var(--ink-dim); max-width: 52ch; }
.plate.painted .tag { z-index: 1; }
.plate.painted.scene { height: auto; aspect-ratio: 3 / 1; min-height: 190px; max-width: 100%; }
.plate.painted.scene::before { background: linear-gradient(to top, rgba(34,29,46,1), rgba(34,29,46,.35) 30%, rgba(34,29,46,0) 55%); }
@media (prefers-reduced-motion: no-preference) { .plate.painted { animation: drift 24s ease-in-out infinite alternate; background-size: cover, auto; } }
@keyframes drift { from { background-position: center 38%, 0 0; } to { background-position: center 46%, 0 0; } }

.text { padding: 22px 26px 26px; display: grid; gap: 14px; }
.text h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
.text p { margin: 0; max-width: 66ch; }
.witness { border-left: 2px solid var(--gold); padding-left: 14px; color: var(--ink-dim); display: grid; gap: 10px; }
.witness .lbl, .lbl { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.speech { font-family: var(--display); font-size: 23px; line-height: 1.3; font-weight: 600; color: var(--ink); max-width: 60ch; }
.memory { font-size: 15px; color: var(--saffron); font-style: italic; }
.curse { font-size: 15px; color: var(--vermilion); }

.choices { display: grid; gap: 10px; margin-top: 4px; }
.choice { width: 100%; text-align: left; display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 4px 12px; align-items: start;
  background: var(--leaf-2); color: var(--ink); border: 1px solid rgba(212,168,75,.4); border-radius: 12px; padding: 14px 16px; font: inherit; cursor: pointer; min-height: 56px; transition: border-color .15s, transform .15s; }
.choice:hover:not(:disabled) { border-color: var(--saffron); transform: translateX(2px); }
.choice:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.choice .k { grid-row: span 2; width: 28px; height: 28px; border: 1px solid var(--gold); border-radius: 6px; display: grid; place-items: center; color: var(--gold); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.choice .t { font-weight: 700; font-size: 17px; line-height: 1.35; }
.choice .fx { font-size: 13.5px; color: var(--ink-dim); }
.fx .up { color: var(--malachite); } .fx .down { color: var(--vermilion); } .fx .vow { color: var(--saffron); }
.choice:disabled { cursor: not-allowed; opacity: .55; }
.choice:disabled .k { border-color: var(--ink-dim); color: var(--ink-dim); }

/* Creation form */
.field { display: grid; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--leaf-2); border: 1px solid rgba(212,168,75,.35); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.opt[aria-pressed="true"] { background: rgba(229,135,46,.2); border-color: var(--saffron); color: var(--ink); }
.opt:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
.origins { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.origin { font: inherit; text-align: left; color: var(--ink); background: var(--leaf-2); border: 1px solid rgba(212,168,75,.3); border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; display: grid; }
.origin i { display: block; aspect-ratio: 4 / 3; max-width: 100%; background-size: cover; background-position: center; }
.origin div { padding: 10px 12px 12px; display: grid; gap: 2px; }
.origin b { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.15; }
.origin small { font-size: 13px; color: var(--ink-dim); line-height: 1.35; }
.origin[aria-pressed="true"] { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.origin:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
input[type=text] { font: inherit; color: var(--ink); background: var(--leaf-2); border: 1px solid rgba(212,168,75,.4); border-radius: 10px; padding: 10px 12px; width: min(100%, 320px); }
input[type=text]:focus-visible { outline: 2px solid var(--saffron); outline-offset: 1px; }
.cta { font: inherit; font-weight: 700; font-size: 17px; color: var(--night); background: var(--saffron); border: 0; border-radius: 10px; padding: 14px 24px; min-height: 52px; cursor: pointer; justify-self: start; }
.cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.note { font-size: 14px; color: var(--ink-dim); }

/* Ledger */
.ledger { background: var(--leaf); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; display: grid; gap: 18px; min-width: 0; }
.ledger h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.ledger .sub { font-size: 13px; color: var(--ink-dim); margin-top: -10px; }
.meter { display: grid; gap: 5px; }
.meter .row { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 500; }
.meter .row span:last-child { color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: 13px; }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.pips i { height: 7px; border-radius: 2px; background: var(--track); transition: background .3s; }
.pips i.on { background: var(--gold); }
.pips i.flash { background: var(--saffron); }
.vowcard { border: 1px solid var(--vermilion); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.vowcard b { font-family: var(--display); font-size: 19px; }
.vowcard small { font-size: 13px; color: var(--ink-dim); }
.vowcard.broken { border-style: dashed; opacity: .7; }
.vowcard.broken b { text-decoration: line-through; }
.empty { font-size: 13.5px; color: var(--ink-dim); font-style: italic; }
.mems { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.mems li { padding-left: 14px; position: relative; }
.mems li::before { content: "◆"; position: absolute; left: 0; color: var(--gold); font-size: 8px; top: 6px; }
.mems li em { color: var(--ink-dim); font-style: normal; font-size: 12.5px; display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { font: inherit; font-size: 13.5px; color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.ghost:hover { color: var(--ink); border-color: var(--gold); }
.ghost:focus-visible { outline: 2px solid var(--saffron); }
pre.save { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: var(--ink-dim); background: var(--night); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; margin: 0; max-height: 260px; overflow: auto; white-space: pre; }
.hint { font-size: 12.5px; color: var(--ink-dim); }
.dev { border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 10px; }
.dev summary { cursor: pointer; font-size: 12.5px; color: var(--ink-dim); }
.dev summary:focus-visible { outline: 2px solid var(--saffron); }
.dev[open] { gap: 10px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }

.ending h1 { font-size: clamp(32px, 5vw, 48px); }
.telling { font-family: var(--display); font-size: 21px; line-height: 1.45; display: grid; gap: 10px; }
.telling p { max-width: 62ch; }

@media (prefers-reduced-motion: no-preference) {
  .leaf .text > * { animation: rise .45s ease both; }
  .leaf .text > *:nth-child(2) { animation-delay: .05s; } .leaf .text > *:nth-child(3) { animation-delay: .1s; } .leaf .text > *:nth-child(4) { animation-delay: .15s; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Kurukshetra: A Life <small>Systems prototype v0.1</small></div>
    <div class="where" id="where"></div>
  </header>
  <div class="game">
    <main class="leaf" id="leaf" aria-live="polite"></main>
    <aside class="ledger" id="ledger" aria-label="Obligations, vows and memories"></aside>
  </div>
</div>

<script>
/* Concept art paths. Origin art was cropped from the supplied paintings (painted titles and panels removed). */
const SCENE_ART = {
 "teacher": "art/scene_teacher.jpg",
 "tournament": "art/scene_tournament.jpg",
 "vow": "art/scene_vow.jpg",
 "secret": "art/scene_secret.jpg",
 "years": "art/scene_years.jpg",
 "day13": "art/scene_day13.jpg"
};
const END_ART = {
 "death": "art/end_death.jpg",
 "survivor": "art/end_survivor.jpg",
 "river": "art/end_river.jpg"
};
const ART = {
 "hastinapura": "art/hastinapura.jpg",
 "panchala": "art/panchala.jpg",
 "matsya": "art/matsya.jpg",
 "dwaraka": "art/dwaraka.jpg",
 "anga": "art/anga.jpg",
 "suta": "art/suta.jpg",
 "nishada": "art/nishada.jpg",
 "gandhara": "art/gandhara.jpg"
};
</script>
<script>
/* =====================================================================
   ENGINE — engine-agnostic rules. Mirrors PRD §4 (canon lock) and §9 (systems).
   Port target: these functions map 1:1 to an Unreal subsystem; CONTENT below
   is plain data and can be exported to JSON for Ink/Yarn/articy or a DataTable.
   ===================================================================== */
const DUTIES = { teacher: "Teacher's debt", court: "Loyalty: Kuru court", family: "Family duty", conscience: "Conscience" };
const BONDS = { karna: "Karna", arjuna: "Arjuna", vasu: "Vasu, your son" };
const VOWS = {
  never_retreat: { name: "Never to retreat", gift: "+ Valor in battle. You cannot turn back once committed." },
  never_lie: { name: "Never to speak a lie", gift: "+ Your word is trusted at every court." },
  spare_karna: { name: "Never to strike Karna", gift: "+ Karna's trust. You may not fight him, whatever side you take." },
};
const MAX_VOWS = 3;
const clamp = v => Math.max(0, Math.min(10, v));

function newLife() {
  return {
    v: 1, name: "", origin: null, temperament: null, heirloom: null,
    age: 6, act: "Character creation", place: "", side: null, teacher: null,
    duty: { teacher: 0, court: 3, family: 4, conscience: 5 },
    bonds: {}, rep: { kuru: 3, common: 3 },
    vows: [], flags: [], memories: [], curses: [], injuries: [],
    alive: true, scene: "create", log: []
  };
}
let S = newLife();
let lastDelta = {};

const has = f => S.flags.includes(f);
function test(c) {               // condition DSL
  if (!c) return true;
  if (c.all) return c.all.every(test);
  if (c.any) return c.any.some(test);
  if (c.not) return !test(c.not);
  if (c.flag) return has(c.flag);
  if (c.origin) return c.origin.includes(S.origin);
  if (c.side) return S.side === c.side;
  if (c.teacher) return S.teacher === c.teacher;
  if (c.vow) return S.vows.some(v => v.id === c.vow && !v.broken);
  if (c.bond) return (S.bonds[c.bond[0]] ?? 0) >= c.bond[1];
  if (c.cursed) return S.curses.length > 0;
  return true;
}
function apply(fx) {             // effect DSL
  lastDelta = {};
  if (!fx) return;
  for (const [k, d] of Object.entries(fx.duty || {})) { S.duty[k] = clamp(S.duty[k] + d); lastDelta["duty." + k] = d; }
  for (const [k, d] of Object.entries(fx.bond || {})) { S.bonds[k] = clamp((S.bonds[k] ?? 3) + d); lastDelta["bond." + k] = d; }
  for (const [k, d] of Object.entries(fx.rep || {})) { S.rep[k] = clamp(S.rep[k] + d); }
  for (const f of [].concat(fx.flag || [])) if (!has(f)) S.flags.push(f);
  if (fx.memory) S.memories.push({ who: fx.memory[0], text: fx.memory[1], age: S.age });
  if (fx.set) Object.assign(S, fx.set);
  if (fx.vowTake && S.vows.filter(v => !v.broken).length < MAX_VOWS && !S.vows.some(v => v.id === fx.vowTake)) S.vows.push({ id: fx.vowTake, broken: false, age: S.age });
  if (fx.vowBreak) { const v = S.vows.find(v => v.id === fx.vowBreak && !v.broken); if (v) { v.broken = true; S.flags.push("broke_" + v.id); S.rep.kuru = clamp(S.rep.kuru - 1); } }
  if (fx.curse) S.curses.push({ id: fx.curse, fired: false });
  if (fx.injury) S.injuries.push(fx.injury);
  if (fx.die) S.alive = false;
}
// Vow breaks are derived from data, not hand-written per choice: a choice tagged
// "retreat" or "lie" automatically breaks the matching vow if it is held.
function commit(scene, choice) {
  const fx = structuredClone(choice.fx || {});
  if (choice.tags?.includes("retreat") && test({ vow: "never_retreat" })) fx.vowBreak = "never_retreat";
  if (choice.tags?.includes("lie") && test({ vow: "never_lie" })) fx.vowBreak = "never_lie";
  if (choice.tags?.includes("strike_karna") && test({ vow: "spare_karna" })) fx.vowBreak = "spare_karna";
  if (choice.resolve) Object.assign(fx, choice.resolve(S) || {});
  apply(fx);
  S.log.push({ scene: scene.id, choice: choice.id });
  return typeof choice.next === "function" ? choice.next(S) : (choice.next || scene.next);
}
function choose(scene, choice) { go(commit(scene, choice)); }
function go(id) {
  let sc = SCENES[id];
  while (sc && sc.when && !test(sc.when)) sc = SCENES[sc.skipTo];  // optional scenes
  S.scene = sc ? sc.id : "ending";
  if (sc?.enter) apply(sc.enter);
  render();
  document.getElementById("leaf").scrollIntoView({ block: "start", behavior: "smooth" });
}

/* Preview text is generated from the same data the engine applies, so the
   ▲/▼ hints can never drift from the real effects. */
function preview(choice) {
  const out = [];
  const fx = choice.fx || {};
  for (const [k, d] of Object.entries(fx.duty || {})) out.push([d > 0 ? "up" : "down", (d > 0 ? "▲ " : "▼ ") + DUTIES[k]]);
  for (const [k, d] of Object.entries(fx.bond || {})) out.push([d > 0 ? "up" : "down", (d > 0 ? "▲ " : "▼ ") + "Bond: " + (BONDS[k] || k)]);
  if (fx.vowTake) out.push(["vow", "Takes a vow"]);
  const breaks = [["retreat", "never_retreat"], ["lie", "never_lie"], ["strike_karna", "spare_karna"]].filter(([t, v]) => choice.tags?.includes(t) && test({ vow: v }));
  for (const [, v] of breaks) out.push(["down", "Breaks vow: " + VOWS[v].name]);
  if (fx.memory) out.push(["", (fx.memory[0] === "all" ? "The court" : BONDS[fx.memory[0]] || fx.memory[0]) + " will remember"]);
  if (choice.hint) out.push(["", choice.hint]);
  return out;
}

/* =====================================================================
   CONTENT — data only. Canon anchors (witness) always play; choices only
   change the player's own layer (wound). Prose is original, after the
   public-domain Ganguli translation; to be reviewed by the advisory board.
   ===================================================================== */
const ORIGINS = {
  hastinapura: { name: "Hastinapura", blurb: "Child of a palace official, raised beside the Kuru princes", grad: ["#d4a84b", "#c0472f"], fx: { duty: { court: 3 }, bond: { arjuna: 1 }, rep: { kuru: 2 } } },
  panchala:    { name: "Panchala", blurb: "Drupada's kingdom, Drona's old rival", grad: ["#c0472f", "#5c3361"], fx: { duty: { family: 1 }, rep: { kuru: -1 } } },
  matsya:      { name: "Matsya", blurb: "King Virata's quiet land", grad: ["#3e8c72", "#3b5ba9"], fx: { duty: { family: 2 } } },
  dwaraka:     { name: "Dwaraka", blurb: "City of the Yadavas, by the western sea", grad: ["#3b5ba9", "#3e8c72"], fx: { rep: { common: 1 } } },
  anga:        { name: "Anga", blurb: "Karna's kingdom, gifted by Duryodhana", grad: ["#3b5ba9", "#e5872e"], fx: { bond: { karna: 1 }, duty: { court: 1 } } },
  suta:        { name: "Charioteer family", blurb: "Raised among the sutas, like Karna", grad: ["#e5872e", "#c0472f"], fx: { bond: { karna: 2 }, rep: { kuru: -1, common: 2 } } },
  nishada:     { name: "Nishada village", blurb: "Forest people outside the city order", grad: ["#3e8c72", "#16131f"], fx: { rep: { kuru: -2, common: 2 }, duty: { family: 2 } } },
  gandhara:    { name: "Gandhara", blurb: "Shakuni's distant homeland", grad: ["#5c3361", "#d4a84b"], fx: { rep: { kuru: -1 }, duty: { court: 1 } } },
};
const TEMPERAMENTS = ["Bold", "Thoughtful", "Devoted", "Cunning"];
const HEIRLOOMS = ["A worn bow", "A manuscript", "An amulet", "A debt"];
const CANON_DROP_ORIGINS = ["suta", "nishada"];

const SCENES = {
  teacher: {
    id: "teacher", act: "Act II · Training", age: 14, place: "Hastinapura", plate: ["#3e8c72", "#d4a84b"], art: "The training grounds at dawn",
    title: "Who will teach you?",
    body: s => [
      `You are fourteen. The Kuru princes train under Drona, and every family with ambition wants a place near them.`,
      s.origin === "nishada" ? { memory: "In your village they still speak of Ekalavya, who learned the bow from a clay image of Drona and paid for it with his thumb." } : null,
    ],
    choices: [
      { id: "drona", t: "Ask Drona to take you as a student", req: { not: { origin: CANON_DROP_ORIGINS } }, locked: "Drona refuses you. He teaches only those born to the royal order.",
        fx: { set: { teacher: "drona" }, duty: { teacher: 4, court: 1 }, flag: "drona_student" }, hint: "Drona's fee may one day set you against your friends" },
      { id: "kripa", t: "Train with Kripa, preceptor of the Kuru house", req: { origin: ["hastinapura", "anga", "gandhara", "matsya", "dwaraka"] }, locked: "Kripa teaches those tied to the Kuru court.",

/* Endings follow PRD §11; this prototype ends after day 13. */
function ending() {
  const vowIntact = S.vows.length && S.vows.every(v => !v.broken);
  const broke = S.vows.filter(v => v.broken);
  let title, kind;
  if (!S.alive) { title = vowIntact ? "Glorious death" : "Fallen at the breach"; kind = "death"; }
  else if (broke.length) { title = "The broken vow"; kind = "broken"; }
  else if (has("refused_ring")) { title = "The one who would not"; kind = "refused"; }
  else if (S.injuries.length) { title = "The wounded survivor"; kind = "wounded"; }
  else { title = "The survivor of the thirteenth day"; kind = "survivor"; }

  const art = kind === "death" ? "death" : (kind === "broken" || kind === "refused") ? "river" : "survivor";
  const caption = { death: "The thirteenth day ends without you", river: "By the river, after the battle", survivor: "Dawn over the field" }[art];
  const lines = [];
  const who = S.name || "a nameless one";
  const from = ({ suta: "a charioteer family", nishada: "a Nishada village" })[S.origin] || ORIGINS[S.origin].name;
  const taught = S.teacher === "hermit" && has("betrayed_hermit") ? "student of a forest hermit, whose secret they gave away" : ({drona: "student of Drona", kripa: "student of Kripa", hermit: "student of a hermit whose name was never spoken", self: "who taught themself the bow by night"})[S.teacher];
  lines.push(`They sing of ${who}, born to ${from}, ${taught}.`);
  if (has("stood_with_karna")) lines.push(`At seventeen they stood beside Karna when the arena laughed at him.`);
  if (has("stood_with_princes")) lines.push(`At seventeen they stood with the princes, and Karna remembered it.`);
  if (has("silent_at_tournament")) lines.push(`At seventeen they watched in silence, as most people did.`);
  if (has("left_arena")) lines.push(`They left the arena and heard a secret about a basket on the river that few ever knew.`);
  if (S.vows.length) lines.push(S.vows.map(v => `They swore “${VOWS[v.id].name.toLowerCase()}”` + (v.broken ? " and broke it." : " and kept it.")).join(" "));
  if (has("curse_fired")) lines.push(`The hermit's curse found them at the worst hour.`);
  if (!S.alive) lines.push(`On the thirteenth day they drove into the breach behind Abhimanyu and did not come back. Vasu carried the story home.`);
  if (has("could_not_break_through")) lines.push(`On the thirteenth day they were among those who could not break through, and they carried that for the rest of their life.`);
  if (has("saved_vasu")) lines.push(`When the line broke they turned back for their son. Vasu lived.`);
  if (has("held_the_ring")) lines.push(`On the thirteenth day they held their place in the ring that closed on Abhimanyu.`);
  if (has("refused_ring")) lines.push(`On the thirteenth day they lowered their bow and would not close on a lone boy. The court did not forgive it.`);
  if (has("carried_wounded")) lines.push(`On the thirteenth day they left the ring to carry a wounded boy to safety.`);
  for (const i of S.injuries) lines.push(i);
  return { title, kind, lines, art, caption };
}

/* =====================================================================
   RENDER + INPUT. Input is abstracted into commands (PRD §9.7): clicks, keys
   and (later) touch gestures all call the same command.
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let currentChoices = [];
const Commands = { choose(i) { const c = currentChoices[i]; if (c && !c.disabled) c.run(); } };

function renderBlocks(arr) {
  return (arr || []).filter(Boolean).map(b => {
    if (typeof b === "string") return `<p>${esc(b)}</p>`;
    if (b.speaker) return `<div><div class="lbl">${esc(b.speaker)}</div><p class="speech">${esc(b.line)}</p></div>`;
    if (b.memory) return `<p class="memory">${esc(b.memory)}</p>`;
    if (b.curse) return `<p class="curse">${esc(b.curse)}</p>`;
    return "";
  }).join("");
}

function render() {
  const leaf = $("leaf");
  currentChoices = [];
  if (S.scene === "create") { renderCreate(); renderLedger(); return; }
  if (S.scene === "ending") { renderEnding(); renderLedger(); return; }
  const sc = SCENES[S.scene];
  S.age = sc.age; S.act = sc.act; S.place = sc.place;
  $("where").innerHTML = `<b>${esc(sc.act)}</b>Age ${sc.age} · ${esc(sc.place)}`;
  const witness = typeof sc.witness === "function" ? sc.witness(S) : sc.witness;
  const body = typeof sc.body === "function" ? sc.body(S) : sc.body;
  const choices = sc.choices.map(c => ({ c, ok: test(c.req) })).filter(x => x.ok || x.c.locked);
  leaf.innerHTML = `
    <div class="plate${SCENE_ART[sc.id] ? " painted scene" : ""}" style="${SCENE_ART[sc.id] ? `--img:url(${SCENE_ART[sc.id]})` : `--plate:linear-gradient(120deg, ${sc.plate[0]}, ${sc.plate[1]})`}">
      <span>${SCENE_ART[sc.id] ? `<small>${esc(sc.art)}</small>` : esc(sc.art) + " · art placeholder"}</span>
      ${sc.canon ? `<span class="tag canon" title="Canon anchor: this always happens">Canon anchor</span>` : `<span class="tag yours">Your life</span>`}
    </div>
    <div class="text">
      <h1>${esc(sc.title)}</h1>
      ${witness ? `<div class="witness"><div class="lbl">What happens, whatever you do</div>${renderBlocks(witness)}</div>` : ""}
      ${renderBlocks(body)}
      <div class="choices" id="choices"></div>
      <p class="hint">Choose with a tap, or press <kbd>1</kbd>–<kbd>${choices.length}</kbd>.</p>
    </div>`;
  const box = $("choices");
  choices.forEach(({ c, ok }, i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; b.disabled = !ok; b.id = "choice-" + c.id;
    const fx = ok ? preview(c).map(([cls, t]) => `<span class="${cls}">${esc(t)}</span>`).join(" &nbsp; ") : esc(c.locked);
    b.innerHTML = `<span class="k">${i + 1}</span><span class="t">${esc(c.t)}</span><span class="fx">${fx}</span>`;
    const run = () => {
      if (sc.after) { showAfter(sc, c); } else choose(sc, c);
    };
    b.addEventListener("click", () => Commands.choose(i));
    currentChoices.push({ disabled: !ok, run });
    box.appendChild(b);
  });
  renderLedger();
}

// Canon "after" beats play once the player has made their choice: the witness
// layer resumes regardless of what the player did.
function showAfter(sc, c) {
  const box = $("choices");
  const picked = document.getElementById("choice-" + c.id);
  const next = commit(sc, c);
  renderLedger();
  box.innerHTML = "";
  if (picked) { picked.disabled = true; picked.querySelector(".fx").textContent = "Your choice"; box.appendChild(picked); }
  const after = document.createElement("div");
  after.className = "witness";
  after.innerHTML = `<div class="lbl">And then, as it always does</div>${renderBlocks(sc.after)}`;
  box.appendChild(after);
  const cont = document.createElement("button");
  cont.className = "cta"; cont.type = "button"; cont.textContent = "Continue";
  cont.addEventListener("click", () => go(next));
  box.appendChild(cont);
  currentChoices = [{ disabled: false, run: () => go(next) }];
  cont.focus({ preventScroll: true });
}

function renderCreate() {
  $("where").innerHTML = `<b>Character creation</b>Age 6`;
  const leaf = $("leaf");
  leaf.innerHTML = `
    ${S.origin ? `<div class="plate painted" style="--img:url(${ART[S.origin]})"><span><b>${esc(ORIGINS[S.origin].name)}</b><small>${esc(ORIGINS[S.origin].blurb)}</small></span><span class="tag yours">Your homeland</span></div>`
  : `<div class="plate" style="--plate:linear-gradient(120deg, #d4a84b, #3b5ba9)"><span>Choose a homeland below</span><span class="tag yours">Your life</span></div>`}
    <div class="text">
      <h1>Where were you born?</h1>
      <p>Your origin shapes how the world treats you. It never limits what you can become.</p>
      <div class="field"><label class="lbl" for="pname">Your name</label><input id="pname" type="text" maxlength="24" placeholder="Name your character" value="${esc(S.name)}"></div>
      <div class="field"><span class="lbl">Origin</span><div class="origins" id="origins"></div></div>
      <div class="field"><span class="lbl">Temperament</span><div class="opts" id="temps"></div></div>
      <div class="field"><span class="lbl">Family heirloom</span><div class="opts" id="heirs"></div></div>
      <button class="cta" id="begin" type="button">Begin this life</button>
      <p class="note" id="need"></p>
    </div>`;
  const o = $("origins");
  for (const [k, v] of Object.entries(ORIGINS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "origin"; b.setAttribute("aria-pressed", S.origin === k);
    b.innerHTML = `<i role="img" aria-label="${esc(v.name)}" style="background-image:${ART[k] ? `url(${ART[k]})` : `linear-gradient(120deg, ${v.grad[0]}, ${v.grad[1]})`}"></i><div><b>${esc(v.name)}</b><small>${esc(v.blurb)}</small></div>`;
    b.onclick = () => { S.origin = k; renderCreate(); renderLedger(); };
    o.appendChild(b);
  }
  const chips = (el, list, key) => list.forEach(t => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = t; b.setAttribute("aria-pressed", S[key] === t);
    b.onclick = () => { S[key] = t; renderCreate(); }; $(el).appendChild(b);
  });
  chips("temps", TEMPERAMENTS, "temperament"); chips("heirs", HEIRLOOMS, "heirloom");
  $("pname").addEventListener("input", e => { S.name = e.target.value; });
  $("begin").onclick = () => {
    const missing = [!S.origin && "an origin", !S.temperament && "a temperament", !S.heirloom && "an heirloom"].filter(Boolean);
    if (missing.length) { $("need").textContent = "Choose " + missing.join(", ") + " to begin."; return; }
    S.name = S.name.trim() || "Ira";
    apply(ORIGINS[S.origin].fx);
    S.flags.push("origin_" + S.origin);
    go("teacher");
  };
}

function renderEnding() {
  const e = ending();
  $("where").innerHTML = `<b>End of prototype</b>${S.alive ? "Age 34 · after the thirteenth day" : "Fell on the thirteenth day"}`;
  $("leaf").innerHTML = `
    <div class="plate painted scene" style="--img:url(${END_ART[e.art]})"><span><small>${esc(e.caption)}</small></span><span class="tag yours">Your ending</span></div>
    <div class="text ending">
      <div class="lbl">Ending</div>
      <h1>${esc(e.title)}</h1>
      <div class="telling">${e.lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>
      <p class="note">This prototype stops after war day 13. In the full game the life continues through day 18, the night raid and the aftermath.</p>
      <button class="cta" id="again" type="button">Live another life</button>
    </div>`;
  $("again").onclick = () => { S = newLife(); render(); };
  currentChoices = [{ disabled: false, run: () => { S = newLife(); render(); } }];
}

let devOpen = false;
function renderLedger() {
  const L = $("ledger");
  const meter = (label, v, key) => {
    const d = lastDelta[key] || 0;
    const pips = Array.from({ length: 10 }, (_, i) => `<i class="${i < v ? (d > 0 && i >= v - d ? "flash" : "on") : ""}"></i>`).join("");
    const delta = d ? ` <span style="color:var(${d > 0 ? "--malachite" : "--vermilion"})">${d > 0 ? "+" : ""}${d}</span>` : "";
    return `<div class="meter"><div class="row"><span>${esc(label)}</span><span>${v} / 10${delta}</span></div><div class="pips" aria-hidden="true">${pips}</div></div>`;
  };
  const duties = Object.entries(DUTIES).map(([k, n]) => meter(k === "teacher" && S.teacher ? `${n}: ${({drona:"Drona",kripa:"Kripa",hermit:"Hermit",self:"none"})[S.teacher]}` : n, S.duty[k], "duty." + k)).join("");
  const bonds = Object.entries(S.bonds).map(([k, v]) => meter("Bond: " + (BONDS[k] || k), v, "bond." + k)).join("") || `<p class="empty">No close bonds yet.</p>`;
  const vows = S.vows.map(v => `<div class="vowcard ${v.broken ? "broken" : ""}"><b>${esc(VOWS[v.id].name)}</b><small>${v.broken ? "Broken. The shame is visible to everyone." : esc(VOWS[v.id].gift)}</small></div>`).join("") || `<p class="empty">No vows taken.</p>`;
  const mems = S.memories.map(m => `<li>${esc(m.text)}<em>${m.who === "all" ? "Remembered by the court" : "Remembered by " + esc(BONDS[m.who] || m.who)} · age ${m.age}</em></li>`).join("");
  L.innerHTML = `
    <h2>Obligations</h2>
    <p class="sub">Choices pull these against each other. There is no good or evil bar.</p>
    ${duties}
    <h2>Bonds</h2>${bonds}
    <h2>Vows (${S.vows.filter(v => !v.broken).length} / ${MAX_VOWS})</h2>${vows}
    ${S.curses.length ? `<h2>Curses</h2><p class="curse">You are cursed. You do not know when it will strike.</p>` : ""}
    <h2>Memories</h2>${mems ? `<ul class="mems">${mems}</ul>` : `<p class="empty">Nothing remembered yet.</p>`}
    <div class="tools"><button class="ghost" id="restart" type="button">Restart this life</button></div>
    <details class="dev" id="devbox"${devOpen ? " open" : ""}><summary>Developer tools</summary>
    <p class="hint">The whole life is stored as plain data, so a PC save can continue on a phone.</p>
    <div class="tools"><button class="ghost" id="copysave" type="button">Copy save data</button></div>
    <pre class="save" id="savebox" tabindex="0">${esc(JSON.stringify({ name: S.name, origin: S.origin, teacher: S.teacher, side: S.side, age: S.age, duty: S.duty, bonds: S.bonds, vows: S.vows, flags: S.flags, curses: S.curses, alive: S.alive }, null, 1))}</pre></details>`;
  $("devbox").addEventListener("toggle", e => { devOpen = e.target.open; });
  $("copysave").onclick = async () => {
    const txt = JSON.stringify(S);
    try { await navigator.clipboard.writeText(txt); $("copysave").textContent = "Copied"; }
    catch { const r = document.createRange(); r.selectNodeContents($("savebox")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copysave").textContent = "Selected, press copy"; }
  };
  $("restart").onclick = () => { S = newLife(); lastDelta = {}; render(); };
}

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) Commands.choose(n - 1);
  if (e.key === "Enter" && currentChoices.length === 1 && document.activeElement?.classList.contains("cta")) { /* native button handles it */ }
});

render();
</script>

</body>
</html>
