<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurukshetra: A Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A narrative RPG: live one whole life inside the Mahabharata.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#e8d5ad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Alegreya+Sans:wght@400;500;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" id="brand">Kurukshetra: A Life</div>
    <div class="where" id="where"></div>
    <nav class="nav" id="nav" aria-label="Game menu" hidden>
      <button type="button" id="nav-char">Character</button>
      <button type="button" id="nav-journal">Journal</button>
      <button type="button" id="nav-menu">Menu</button>
    </nav>
  </header>
  <div class="game" id="game">
    <main class="leaf" id="leaf" aria-live="polite"></main>
    <aside class="ledger" id="ledger" aria-label="Obligations, bonds, vows and memories" hidden></aside>
  </div>
</div>

<!-- Engine (engine-agnostic rules) -->
<script src="js/engine/i18n.js"></script>
<script src="js/engine/core.js"></script>
<script src="js/engine/flow.js"></script>
<script src="js/engine/abilities.js"></script>
<script src="js/engine/combat.js"></script>
<!-- Content (plain data) -->
<script src="js/content/world.js"></script>
<script src="js/content/act1.js"></script>
<script src="js/content/act2.js"></script>
<script src="js/content/act3.js"></script>
<script src="js/content/act4.js"></script>
<script src="js/content/act5.js"></script>
<script src="js/content/act6a.js"></script>
<script src="js/content/act6b.js"></script>
<script src="js/content/act7.js"></script>
<!-- Languages (English is the source text; each file is one dictionary) -->
<script src="js/i18n/hi.js"></script>
<!-- Interface -->
<script src="js/ui/dom.js"></script>
<script src="js/ui/ledger.js"></script>
<script src="js/ui/scene.js"></script>
<script src="js/ui/battle.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/modals.js"></script>
<script src="js/main.js"></script>
</body>
</html>
