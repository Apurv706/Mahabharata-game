<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Aged paper: soft blotches and fine fibres in brown, tiled over the parchment colour. -->
  <filter id="blotch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.27  0 0 0 0 0.10  0 0 0 0.9 -0.32"/>
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.40  0 0 0 0 0.24  0 0 0 0 0.10  0 0 0 0.55 -0.2"/>
  </filter>
  <rect width="420" height="420" filter="url(#blotch)"/>
  <rect width="420" height="420" filter="url(#fibre)" opacity="0.5"/>
</svg>
