name: Fetch Runway videos

# Downloads the accepted Runway clips listed in art_review/video/fetch_list.tsv
# into art_review/video/<clip>/, makes a trimmed copy where trim_seconds > 0
# (<file>_<N>s.mp4, the version the game should use), zips each clip folder
# (reference image + prompts + video), and commits.
# The Runway links in fetch_list.tsv expire on 29-30 Oct 2026; run before then.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Download accepted clips
        run: |
          set -euo pipefail
          failed=0
          tail -n +2 art_review/video/fetch_list.tsv | while IFS=$'\t' read -r clip file trim url; do
            [ -z "$clip" ] && continue
            dir="art_review/video/$clip"
            mkdir -p "$dir"
            if [ -f "$dir/$file" ]; then echo "already have $dir/$file"; continue; fi
            if curl -fsSL --retry 3 -o "$dir/$file" "$url"; then
              ls -l "$dir/$file"
            else
              echo "::error::Download failed for $clip"
              echo "$clip" >> /tmp/failed.txt
              continue
            fi
            if [ "$trim" != "0" ]; then
              out="$dir/${file%.mp4}_${trim}s.mp4"
              ffmpeg -nostdin -loglevel error -y -i "$dir/$file" -t "$trim" -c:v libx264 -preset veryfast -crf 20 -an "$out"
              ls -l "$out"
            fi
          done
          if [ -f /tmp/failed.txt ]; then cat /tmp/failed.txt; exit 1; fi

      - name: Zip each clip folder
        run: |
          set -euo pipefail
          cd art_review/video
          for d in */; do
            d="${d%/}"
            rm -f "$d.zip"
            zip -qr "$d.zip" "$d"
          done
          ls -l

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add art_review/video
          git diff --cached --quiet || git commit -m "Add accepted Runway clips (key moments, endings, key scenes) with zips"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          exit 1
